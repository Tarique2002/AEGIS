[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.1.0"
description = "AEGIS — Self-Learning Autonomous AI Agent Platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "AEGIS Core Engineering Team" }
]
dependencies = [
    "fastapi>=0.111.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<0.32.0",
    "pydantic>=2.7.0,<2.10.0",
    "pydantic-settings>=2.3.0,<2.6.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1.0",
    "asyncpg>=0.29.0,<0.31.0",
    "alembic>=1.13.0,<1.14.0",
    "redis>=5.0.4,<5.2.0",
    "qdrant-client>=1.9.0,<1.12.0",
    "httpx>=0.27.0,<0.28.0",
    "cel-python>=0.4.0,<0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<8.4.0",
    "pytest-asyncio>=0.23.0,<0.25.0",
    "pytest-mock>=3.14.0,<3.15.0",
    "pytest-cov>=5.0.0,<5.1.0",
    "ruff>=0.5.0,<0.7.0",
    "mypy>=1.10.0,<1.12.0",
    "types-redis>=4.6.0",
    "aiosqlite>=0.20.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "backend/alembic",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
]
ignore = [
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "backend/tests",
]
pythonpath = [
    "backend",
]
